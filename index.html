<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>کافه</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#1E3932;--c:#F7F2E8;--gold:#C6A15B;--b:#E9DFCB;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--sp:1}
html{scroll-behavior:smooth;scroll-padding-top:calc(70px + env(safe-area-inset-top,0px));height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--c);color:var(--g);font-family:'Vazirmatn',Tahoma,sans-serif;min-height:100%}
button,input,textarea,select{font-family:inherit;font-size:15px}
#intro{position:fixed;inset:0;background:var(--g);z-index:100;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;transition:opacity calc(1s*var(--sp)),visibility calc(1s*var(--sp))}
#intro.off{opacity:0;visibility:hidden}
#intro h1{color:var(--c);font-weight:300;font-size:clamp(34px,8vw,64px);margin:0;animation:in calc(1.6s*var(--sp)) ease both}
#intro i{display:block;height:1px;width:0;background:var(--gold);animation:ln calc(1.6s*var(--sp)) .3s ease forwards}
@keyframes in{from{opacity:0;letter-spacing:.4em;filter:blur(8px)}to{opacity:1;letter-spacing:.04em;filter:blur(0)}}
@keyframes ln{to{width:min(220px,50vw)}}
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--g) 94%,transparent);backdrop-filter:blur(8px);color:var(--c);padding:10px 18px;padding-top:calc(10px + env(safe-area-inset-top,0px));display:grid;grid-template-columns:1fr auto 1fr;align-items:center;direction:ltr;font-size:13px;box-shadow:0 2px 20px #0002}
.top .ph{display:flex;flex-direction:column;gap:2px;opacity:.85}
.top .ph a,.top>a{color:inherit;text-decoration:none}
.top .nm{font-weight:600;font-size:clamp(17px,3vw,22px);color:var(--gold);display:flex;align-items:center;gap:8px;text-align:center}
.top .nm img{height:30px;border-radius:50%}
.top>a{justify-self:end;border:1px solid var(--gold);padding:6px 14px;border-radius:30px;transition:.3s}
.top>a:hover{background:var(--gold);color:var(--g)}
.hero{text-align:center;padding:56px 20px 18px;animation:up .9s ease both}
.hero h2{font-weight:300;font-size:clamp(26px,5vw,42px);margin:0 0 8px}
.hero p{margin:0;color:#1E3932aa}
.tabs{display:flex;gap:10px;overflow-x:auto;padding:16px 18px;justify-content:center;flex-wrap:wrap}
.tabs a{padding:8px 20px;border-radius:30px;background:var(--b);color:var(--g);text-decoration:none;transition:.3s;white-space:nowrap}
.tabs a:hover{background:var(--gold);color:#fff;transform:translateY(-2px)}
main{max-width:1100px;margin:0 auto;padding:0 18px 40px}
.cat h3{font-weight:600;font-size:24px;margin:34px 0 16px;display:flex;align-items:center;gap:12px}
.cat h3:after{content:"";flex:1;height:1px;background:linear-gradient(to left,transparent,var(--gold))}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}
.card{background:#fff;border-radius:22px;overflow:hidden;cursor:pointer;box-shadow:0 6px 24px #1E39321a;transition:transform .45s cubic-bezier(.2,.8,.2,1),box-shadow .45s;opacity:0;transform:translateY(24px)}
.card.v{opacity:1;transform:none}
.card:hover{transform:translateY(-6px);box-shadow:0 16px 36px #1E393230}
.img{aspect-ratio:4/3;background:linear-gradient(135deg,#E9DFCB,#d8c59c);display:flex;align-items:center;justify-content:center;font-size:64px;overflow:hidden}
.img img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
.card:hover .img img{transform:scale(1.06)}
.card .t{padding:16px 18px}.card b{display:block;font-weight:600;margin-bottom:6px}
.pr{color:#9a7a36;font-size:14px}
#pop{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:18px;background:#1E393255;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);opacity:0;visibility:hidden;transition:.4s}
#pop.on{opacity:1;visibility:visible}
#pop .box{background:var(--c);border-radius:26px;max-width:460px;width:100%;max-height:90vh;overflow:auto;transform:translateY(30px) scale(.94);transition:.5s cubic-bezier(.2,.8,.2,1);position:relative}
#pop.on .box{transform:none}
#pop .img{aspect-ratio:16/10}
#pop .in{padding:22px}
#pop h4{margin:0 0 8px;font-size:22px}
#pop .x{position:absolute;top:12px;left:12px;width:36px;height:36px;border-radius:50%;border:0;background:#fffd;cursor:pointer;font-size:18px;z-index:2}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.chips span{background:var(--b);border-radius:20px;padding:3px 12px;font-size:13px}
footer{background:var(--g);color:var(--c);padding:44px 20px calc(24px + env(safe-area-inset-bottom,0px));text-align:center}
footer .w{max-width:700px;margin:auto}footer h3{color:var(--gold);font-weight:400;margin:0 0 12px}
footer p{line-height:2;opacity:.9;margin:6px 0}footer a{color:var(--c)}
.gear{background:none;border:0;color:var(--c);opacity:.25;cursor:pointer;font-size:16px;margin-top:20px;transition:.3s}.gear:hover{opacity:.7}
@keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
/* admin */
.adm{max-width:1000px;margin:0 auto;padding:18px}
.ab{background:#fff;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 4px 16px #1E39321a;animation:up .4s both}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.nav button,.btn{border:0;border-radius:12px;padding:9px 16px;background:var(--b);color:var(--g);cursor:pointer;transition:.25s}
.nav button.on,.btn.p{background:var(--g);color:var(--c)}.btn.d{background:#b5443c;color:#fff}.btn.g{background:var(--gold);color:#fff}
label{display:block;font-size:13px;margin:10px 0 4px;opacity:.75}
input[type=text],input[type=password],input[type=number],textarea,select{width:100%;padding:9px 12px;border:1px solid #d6c9aa;border-radius:10px;background:#fffdf8;color:var(--g)}
input[type=color]{width:60px;height:38px;border:0;background:none}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.hd{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.tl{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--g);color:#fff;padding:10px 22px;border-radius:30px;z-index:90}
.stat{font-size:30px;font-weight:700}
@media(max-width:560px){.top{grid-template-columns:auto 1fr auto;padding:10px;font-size:11px;gap:6px}.top .nm{font-size:15px}.top>a{padding:5px 9px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style></head><body>
<div id="app"></div><div id="pop"></div>
<script type="application/json" id="st">{"name":"کافه آرامش","logo":"","colors":{"g":"#1E3932","c":"#F7F2E8","gold":"#C6A15B"},"tel":"02112345678","mob":"09123456789","addr":"تهران، خیابان ولیعصر، پلاک ۱۲","about":"کافه‌ای آرام و دنج با قهوه‌ی تازه‌دم و دسرهای دست‌ساز. جایی برای لحظه‌های آرام شما.","tag":"منوی کافه","anim":{"intro":true,"speed":1,"hover":true},"cats":[{"id":"c1","n":"قهوه و نوشیدنی","show":true},{"id":"c2","n":"کیک و دسر","show":true}],"prods":[{"id":"p1","cat":"c1","n":"اسپرسو","p":85000,"d":"شات غلیظ و خوش‌عطر از دانه‌های برشته‌ی تازه.","ing":"قهوه عربیکا","img":"","em":"☕","show":true},{"id":"p2","cat":"c1","n":"کارامل لاته","p":145000,"d":"اسپرسو، شیر بخارداده و سس کارامل خانگی.","ing":"اسپرسو، شیر، کارامل","img":"","em":"🥛","show":true},{"id":"p3","cat":"c1","n":"آیس آمریکانو","p":110000,"d":"اسپرسوی دوبل روی یخ، سبک و با طراوت.","ing":"اسپرسو، آب، یخ","img":"","em":"🧊","show":true},{"id":"p4","cat":"c2","n":"کیک شکلاتی","p":165000,"d":"کیک نرم شکلاتی با گاناش تلخ.","ing":"شکلات تلخ، کره، تخم‌مرغ، آرد","img":"","em":"🍰","show":true},{"id":"p5","cat":"c2","n":"چیزکیک","p":175000,"d":"چیزکیک کرمی با پایه‌ی بیسکوییتی و سس توت.","ing":"پنیر خامه‌ای، بیسکویت، توت","img":"","em":"🍮","show":true}],"users":[{"u":"owner","role":"owner","h":"5bb40987325e1218dfb51c5eb6f46d681234ebfe259979de62547b2954c440f1"}]}</script>
<script>
let S=JSON.parse(document.getElementById('st').textContent),U=null,tab='d';
const $=s=>document.querySelector(s),e=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const fa=n=>Number(n).toLocaleString('fa-IR'),id=()=>'x'+Math.random().toString(36).slice(2,8);
const sha=async t=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('cafe1118::'+t)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const TABS={d:['داشبورد','owner manager editor'],b:['ظاهر و برند','owner manager'],p:['محصولات','owner manager editor'],c:['دسته‌بندی‌ها','owner manager editor'],i:['اطلاعات کافه','owner manager'],k:['تماس و نشانی','owner manager'],a:['انیمیشن','owner'],u:['مدیریت دسترسی','owner']};
function theme(){const r=document.documentElement.style;r.setProperty('--g',S.colors.g);r.setProperty('--c',S.colors.c);r.setProperty('--gold',S.colors.gold);r.setProperty('--sp',S.anim.speed);document.title=S.name}
const set=(p,v)=>{const k=p.split('.');let o=S;while(k.length>1)o=o[k.shift()];o[k[0]]=v;theme()};
function route(){theme();location.hash==='#/admin'?admin():site()}
/* ---------- site ---------- */
let introDone=false;
function site(){
  const ph=(t)=>`<a href="tel:${e(t)}">${e(t)}</a>`;
  $('#app').innerHTML=`${S.anim.intro&&!introDone?`<div id="intro"><h1>${e(S.name)}</h1><i></i></div>`:''}
  <header class="top"><div class="ph">${ph(S.tel)}${ph(S.mob)}</div><div class="nm">${S.logo?`<img src="${e(S.logo)}" alt="">`:''}${e(S.name)}</div><a href="#about" onclick="event.preventDefault();document.getElementById('about').scrollIntoView({behavior:'smooth'})">درباره ما</a></header>
  <div class="hero"><h2>${e(S.tag)}</h2><p>با آرامش انتخاب کنید</p></div>
  <nav class="tabs">${S.cats.filter(c=>c.show).map(c=>`<a href="#k${c.id}" onclick="event.preventDefault();document.getElementById('k${c.id}').scrollIntoView({behavior:'smooth'})">${e(c.n)}</a>`).join('')}</nav>
  <main>${S.cats.filter(c=>c.show).map(c=>{const ps=S.prods.filter(p=>p.cat===c.id&&p.show);return ps.length?`<section class="cat" id="k${c.id}"><h3>${e(c.n)}</h3><div class="grid">${ps.map(p=>`<div class="card" onclick="openP('${p.id}')"><div class="img">${p.img?`<img src="${e(p.img)}" alt="${e(p.n)}">`:e(p.em)}</div><div class="t"><b>${e(p.n)}</b><span class="pr">${fa(p.p)} تومان</span></div></div>`).join('')}</div></section>`:''}).join('')}</main>
  <footer id="about"><div class="w"><h3>درباره ما</h3><p>${e(S.about)}</p><p>تلفن: <a href="tel:${e(S.tel)}">${e(S.tel)}</a> · همراه: <a href="tel:${e(S.mob)}">${e(S.mob)}</a></p><p>نشانی: ${e(S.addr)}</p><button class="gear" title="" onclick="location.hash='#/admin'">⚙</button></div></footer>`;
  if($('#intro')){introDone=true;setTimeout(()=>$('#intro')?.classList.add('off'),2400*S.anim.speed)}
  const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('v');io.unobserve(x.target)}}),{threshold:.1});
  document.querySelectorAll('.card').forEach((c,i)=>{c.style.transitionDelay=(i%4)*70+'ms';io.observe(c)});
}
function openP(i){const p=S.prods.find(x=>x.id===i),ing=p.ing.split(/[،,]/).map(s=>s.trim()).filter(Boolean);
 $('#pop').innerHTML=`<div class="box"><button class="x" onclick="closeP()">✕</button><div class="img">${p.img?`<img src="${e(p.img)}">`:e(p.em)}</div><div class="in"><h4>${e(p.n)}</h4><div class="pr" style="font-size:18px">${fa(p.p)} تومان</div><p style="line-height:1.9">${e(p.d)}</p>${ing.length?`<div class="chips">${ing.map(x=>`<span>${e(x)}</span>`).join('')}</div>`:''}</div></div>`;
 requestAnimationFrame(()=>$('#pop').classList.add('on'));document.body.style.overflow='hidden'}
function closeP(){$('#pop').classList.remove('on');document.body.style.overflow=''}
$('#pop').addEventListener('click',ev=>{if(ev.target.id==='pop')closeP()});
document.addEventListener('keydown',ev=>ev.key==='Escape'&&closeP());
/* ---------- admin ---------- */
const toast=m=>{const t=document.createElement('div');t.className='tl';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2800)};
function admin(){
 if(!U){$('#app').innerHTML=`<div class="adm" style="max-width:380px;padding-top:12vh"><div class="ab"><h2 style="font-weight:400;margin-top:0">ورود به پنل</h2><label>نام کاربری</label><input type="text" id="lu" value="owner" autocomplete="username"><label>گذرواژه</label><input type="password" id="lp" autocomplete="current-password" onkeydown="event.key==='Enter'&&login()"><p style="display:flex;gap:8px;margin-top:16px"><button class="btn p" onclick="login()">ورود</button><button class="btn" onclick="location.hash=''">بازگشت</button></p></div></div>`;return}
 const tabs=Object.entries(TABS).filter(([k,v])=>v[1].includes(U.role));if(!tabs.find(t=>t[0]===tab))tab=tabs[0][0];
 $('#app').innerHTML=`<div class="adm"><div class="hd"><h2 style="font-weight:400;margin:0">پنل مدیریت · ${e(U.u)} (${{owner:'مالک',manager:'مدیر',editor:'ویراستار'}[U.role]})</h2><span><button class="btn g" onclick="save()">ذخیره و انتشار</button> <button class="btn" onclick="U=null;location.hash=''">خروج</button></span></div>
 <div class="nav">${tabs.map(([k,v])=>`<button class="${k===tab?'on':''}" onclick="tab='${k}';admin()">${v[0]}</button>`).join('')}</div>${panel()}</div>`}
async function login(){const u=S.users.find(x=>x.u===$('#lu').value.trim());const h=await sha($('#lp').value);
 if(u&&u.h===h){U=u;admin()}else toast('نام کاربری یا گذرواژه نادرست است')}
const inp=(l,p,t='text',v)=>`<label>${l}</label><input type="${t}" value="${e(v??p.split('.').reduce((o,k)=>o[k],S))}" oninput="set('${p}',this.value)">`;
function img(o,i){return `<label>تصویر</label><input type="file" accept="image/*" onchange="up(this,'${o}','${i}')">`}
function up(f,o,i){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,520/im.width),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);const d=c.toDataURL('image/jpeg',.72);
 if(o==='logo')S.logo=d;else S.prods.find(p=>p.id===i).img=d;toast('تصویر افزوده شد');admin()};im.src=r.result};r.readAsDataURL(f.files[0])}
function mv(a,i,d){const j=i+d;if(j<0||j>=S[a].length)return;[S[a][i],S[a][j]]=[S[a][j],S[a][i]];admin()}
function panel(){
 if(tab==='d')return `<div class="row"><div class="ab"><div class="stat">${fa(S.prods.length)}</div>محصول (${fa(S.prods.filter(p=>p.show).length)} نمایان)</div><div class="ab"><div class="stat">${fa(S.cats.length)}</div>دسته‌بندی</div><div class="ab"><div class="stat">${fa(S.users.length)}</div>کاربر پنل</div></div><div class="ab">پس از هر ویرایش، دکمه‌ی «ذخیره و انتشار» را بزنید تا تغییرات برای مشتریان نمایان شود.</div>`;
 if(tab==='b')return `<div class="ab"><div class="row"><div>${inp('نام کافه','name')}</div><div>${inp('شعار زیر عنوان','tag')}</div></div><div class="row"><div><label>سبز تیره</label><input type="color" value="${S.colors.g}" oninput="set('colors.g',this.value)"></div><div><label>کرم</label><input type="color" value="${S.colors.c}" oninput="set('colors.c',this.value)"></div><div><label>طلایی</label><input type="color" value="${S.colors.gold}" oninput="set('colors.gold',this.value)"></div></div>${img('logo')}${S.logo?`<p><img src="${S.logo}" height="50"> <button class="btn d" onclick="S.logo='';admin()">حذف لوگو</button></p>`:''}</div>`;
 if(tab==='i')return `<div class="ab">${inp('نام کافه','name')}<label>درباره ما</label><textarea rows="5" oninput="set('about',this.value)">${e(S.about)}</textarea></div>`;
 if(tab==='k')return `<div class="ab"><div class="row"><div>${inp('تلفن کافه','tel')}</div><div>${inp('موبایل','mob')}</div></div>${inp('نشانی','addr')}</div>`;
 if(tab==='a')return `<div class="ab"><label><input type="checkbox" ${S.anim.intro?'checked':''} onchange="S.anim.intro=this.checked"> انیمیشن آغازین</label><label>سرعت انیمیشن (۰٫۵ تند ← ۲ کند)</label><input type="number" step=".1" min=".5" max="2" value="${S.anim.speed}" oninput="set('anim.speed',+this.value||1)"></div>`;
 if(tab==='c')return `<div class="ab">${S.cats.map((c,i)=>`<div class="row" style="align-items:end;margin-bottom:10px"><div><label>نام</label><input type="text" value="${e(c.n)}" oninput="S.cats[${i}].n=this.value"></div><div><label><input type="checkbox" ${c.show?'checked':''} onchange="S.cats[${i}].show=this.checked"> نمایش</label><button class="btn" onclick="mv('cats',${i},-1)">↑</button> <button class="btn" onclick="mv('cats',${i},1)">↓</button> <button class="btn d" onclick="if(confirm('حذف شود؟')){S.prods=S.prods.filter(p=>p.cat!=='${c.id}');S.cats.splice(${i},1);admin()}">حذف</button></div></div>`).join('')}<button class="btn p" onclick="S.cats.push({id:id(),n:'دسته‌ی جدید',show:true});admin()">+ دسته‌ی جدید</button></div>`;
 if(tab==='p')return S.prods.map((p,i)=>`<div class="ab"><div class="row"><div><label>نام</label><input type="text" value="${e(p.n)}" oninput="S.prods[${i}].n=this.value"></div><div><label>قیمت (تومان)</label><input type="number" value="${p.p}" oninput="S.prods[${i}].p=+this.value"></div><div><label>دسته</label><select onchange="S.prods[${i}].cat=this.value">${S.cats.map(c=>`<option value="${c.id}" ${c.id===p.cat?'selected':''}>${e(c.n)}</option>`).join('')}</select></div></div><label>توضیحات</label><textarea rows="2" oninput="S.prods[${i}].d=this.value">${e(p.d)}</textarea><label>مواد تشکیل‌دهنده (با ویرگول جدا کنید)</label><input type="text" value="${e(p.ing)}" oninput="S.prods[${i}].ing=this.value">${img('p',p.id)}<p><label style="display:inline"><input type="checkbox" ${p.show?'checked':''} onchange="S.prods[${i}].show=this.checked"> نمایان</label> <button class="btn" onclick="mv('prods',${i},-1)">↑</button> <button class="btn" onclick="mv('prods',${i},1)">↓</button> ${p.img?`<button class="btn" onclick="S.prods[${i}].img='';admin()">حذف تصویر</button>`:''} <button class="btn d" onclick="if(confirm('حذف شود؟')){S.prods.splice(${i},1);admin()}">حذف محصول</button></p></div>`).join('')+`<button class="btn p" onclick="S.prods.push({id:id(),cat:S.cats[0]?.id,n:'محصول جدید',p:0,d:'',ing:'',img:'',em:'☕',show:true});admin()">+ محصول جدید</button>`;
 if(tab==='u')return `<div class="ab">${S.users.map((u,i)=>`<p class="hd"><span>${e(u.u)} — ${{owner:'مالک',manager:'مدیر',editor:'ویراستار'}[u.role]}</span>${u.u!=='owner'?`<button class="btn d" onclick="S.users.splice(${i},1);admin()">حذف</button>`:''}</p>`).join('')}<hr><div class="row"><div><label>نام کاربری</label><input type="text" id="nu"></div><div><label>گذرواژه</label><input type="password" id="np"></div><div><label>نقش</label><select id="nr"><option value="manager">مدیر (محتوا و منو)</option><option value="editor">ویراستار (محصولات و دسته‌ها)</option><option value="owner">مالک (دسترسی کامل)</option></select></div></div><p><button class="btn p" onclick="addU()">افزودن کاربر</button></p><label>تغییر گذرواژه‌ی شما</label><input type="password" id="cp"><p><button class="btn" onclick="chp()">تغییر</button></p></div>`}
async function addU(){const u=$('#nu').value.trim(),p=$('#np').value;if(!u||p.length<8||S.users.some(x=>x.u===u))return toast('نام یکتا و گذرواژه‌ی دست‌کم ۸ نویسه لازم است');S.users.push({u,role:$('#nr').value,h:await sha(p)});admin()}
async function chp(){const p=$('#cp').value;if(p.length<8)return toast('دست‌کم ۸ نویسه');U.h=await sha(p);toast('گذرواژه تغییر کرد؛ ذخیره و انتشار را بزنید')}
async function save(){const a=window.claude?await claude.use('artifact'):null;if(!a)return toast('فقط مالک صفحه می‌تواند منتشر کند');
 try{const c=document.documentElement.cloneNode(true);c.querySelector('#app').innerHTML='';c.querySelector('#pop').innerHTML='';c.querySelector('#st').textContent=JSON.stringify(S).replace(/</g,'\\u003c');c.removeAttribute('style');await a.publish('<!doctype html>'+c.outerHTML)}catch(x){toast('انتشار انجام نشد')}}
addEventListener('hashchange',route);route();
